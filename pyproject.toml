[project]
name = "aide"
version = "0.1.0"
description = "AIDE —— 学习与求职双轨的个人 Agent（Agent = LLM + 上下文 + 工具，Harness 是竞争力）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "apscheduler>=3.10",
  "jsonschema>=4.22",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
# 知识层（检索）依赖，仅在构建/查询索引时需要
retrieval = [
  "torch>=2.3",
  "transformers>=4.44",
  "rank-bm25>=0.2.2",
  "ranx>=0.3.20",
]
eval = ["pytest>=8.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aide"]

[tool.pytest.ini_options]
pythonpath = ["src", "knowledge", "tests"]
testpaths = ["tests"]
addopts = "-q"
# 按「跑起来需要什么」分档，而不是按知识归属。
# 不分档会演变成两种坏结局：make test 越来越慢，或某天开始需要 API key 才能跑。
markers = [
  "unit: 纯函数与替身，无网络、无真实模型、毫秒级",
  "contract: 需要真实厂商 API，验证「对方怎么收」而非「我们怎么发」",
  "slow: 需要加载模型或跑长任务，默认不参与日常回归",
]

[tool.ruff]
line-length = 100
target-version = "py311"
